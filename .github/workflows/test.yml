name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract state machine
        run: forge test -vv
      - name: Independent state model
        run: python3 -m unittest discover -s model -p 'test_*.py'
